   TYPE Noto Serif TC display + Noto Sans TC text
   LAYOUT banner with logo in its quiet left side; phone: banner, then logo + title, then 2-col cards */

img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:600;line-height:1.2;letter-spacing:.02em;margin:0;color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
.top{position:sticky;top:0;z-index:20;background:rgba(247,239,230,.86);backdrop-filter:blur(8px);border-bottom:1.5px dashed var(--rose)}
.top .wrap{display:flex;align-items:center;gap:8px 16px;min-height:62px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:"Noto Serif TC",serif;font-weight:600;font-size:20px;text-decoration:none;color:var(--wine);white-space:nowrap;letter-spacing:.04em}
.top nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.top nav a{text-decoration:none;color:var(--ink);padding:8px 11px;border-radius:999px;font-size:15px;white-space:nowrap}
.top nav a:hover,.top nav a:focus-visible,.top nav a[aria-current=page]{background:rgba(201,143,134,.18);color:var(--wine);outline:none}
.cover-bg{background:var(--paper) url(images/cover-bg.jpg) center/cover no-repeat;padding:clamp(28px,4vw,56px) 0 clamp(40px,6vw,80px);min-height:calc(100vh - 62px)}
.home-grid{max-width:1000px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.8vw,22px)}
.home-grid .title{grid-column:1/3;grid-row:1;align-self:start;text-align:left;padding:4px 0 0 4px}
.logo{width:clamp(120px,14vw,170px);height:auto;margin:0 0 8px}

.thread{display:block;margin:8px 0 0;width:130px;height:10px}
.patches{display:contents}
.patch{display:block;text-decoration:none;color:var(--ink);background:rgba(255,250,245,.9);border-radius:12px;padding:8px;position:relative;box-shadow:0 10px 30px -18px rgba(74,58,51,.45);transition:transform .35s}
.patch::before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(201,143,134,.7);border-radius:11px;pointer-events:none}
.patch:hover,.patch:focus-visible{transform:translateY(-4px)}
.patch:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
.patch .ph{aspect-ratio:4/3;overflow:hidden;border-radius:9px;background:#eee}
.patch img{width:100%;height:100%;object-fit:cover}
.patch .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:9px 6px 3px;flex-wrap:wrap}
.patch b{font-family:"Noto Serif TC",serif;font-weight:600;font-size:clamp(15px,1.4vw,18px);letter-spacing:.04em}
.patch span{font-size:12.5px;color:var(--soft);white-space:nowrap}
.about{background:var(--paper) url(images/hero.jpg) right center/cover no-repeat;aspect-ratio:1672/941;max-height:820px;width:100%;display:flex;align-items:center}
.about .wrap{width:100%}
.ab{width:min(28%,400px);text-align:center;margin-block:32px;padding:20px 22px 22px;background:rgba(255,250,245,.55);border-radius:18px;box-shadow:0 0 40px 20px rgba(255,250,245,.45)}
.about h2{font-size:clamp(24px,2.6vw,34px);color:var(--wine);letter-spacing:.1em;margin-bottom:clamp(14px,2vw,22px);padding:6px 0 14px;background:url(images/stroke.svg) center bottom/min(100%,300px) 46px no-repeat}
.about p{margin:0 0 .9em;text-align:left;font-size:clamp(14px,1.2vw,15.5px);line-height:1.95;color:var(--ink)}
.about .labels{margin-top:22px}
.about .back{display:block;text-align:left;min-height:0;padding:0 0 6px;font-size:14px}
.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:200px;margin:0 auto}
.labels figure{margin:0}
.labels img{border-radius:6px;box-shadow:0 10px 26px -16px rgba(74,58,51,.5)}
.labels figcaption{font-size:12.5px;color:var(--soft);margin-top:6px;letter-spacing:.08em}
.cathead{padding:clamp(26px,3.5vw,44px) 0 6px;text-align:center;position:relative}
.cathead::before,.cathead::after{content:"";position:absolute;top:8px;width:clamp(70px,10vw,130px);aspect-ratio:160/220;background:url(images/sprig.svg) center/contain no-repeat;pointer-events:none}
.cathead::before{left:max(3vw,8px);transform:scaleX(-1) rotate(-8deg)}
.cathead::after{right:max(3vw,8px);transform:rotate(-8deg)}
.cathead h1{background:url(images/stroke.svg) center 62%/min(100%,360px) 80px no-repeat;padding:10px 24px}
.back{display:inline-block;color:var(--wine);text-decoration:none;font-weight:500;padding:8px 0;min-height:44px}
.back:hover{text-decoration:underline}
.cathead h1{font-size:clamp(30px,4vw,44px);letter-spacing:.06em;display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap}
.cathead h1 small{font:400 16px "Noto Sans TC",sans-serif;color:var(--soft)}
.cathead h1::after{content:"";flex-basis:100%;height:0}
.cathead .wrap::after{content:"";display:block;width:84px;margin:14px auto 0;border-top:1.5px dashed var(--rose)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;padding-block:clamp(24px,3.5vw,44px) clamp(40px,5vw,72px)}
.work{background:var(--card) url(images/stroke.svg) right -70px bottom -34px/280px 90px no-repeat;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px -20px rgba(74,58,51,.5);border:1px solid rgba(201,143,134,.22)}
.cover{all:unset;cursor:pointer;display:block;aspect-ratio:4/3;overflow:hidden;background:#eee;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cover:hover img{transform:scale(1.04)}
.cover:focus-visible{outline:2px solid var(--wine);outline-offset:-2px}
.cover .cnt{position:absolute;right:10px;bottom:10px;background:rgba(74,58,51,.72);color:#fff;font-size:13px;padding:3px 10px;border-radius:999px}
.work .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.work h3{font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.work h3 span{font:400 14px "Noto Sans TC",sans-serif;color:var(--soft);white-space:nowrap}
.work p{margin:0;color:var(--soft);font-size:15px}
.thumbs{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.thumbs button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:7px;overflow:hidden}
.thumbs button:focus-visible{outline:2px solid var(--wine)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.more{font-size:14px;color:var(--soft);align-self:center}
footer{padding:40px 0 36px;color:var(--soft);font-size:14px;position:relative;background:linear-gradient(rgba(247,239,230,0),rgba(247,239,230,.75) 40px)}
footer::before{content:"";position:absolute;left:0;right:0;top:-6px;height:24px;background:url(images/stroke.svg) center/100% 100% no-repeat;opacity:.8}
footer::after{content:"";position:absolute;right:max(4vw,12px);bottom:8px;width:64px;aspect-ratio:160/220;background:url(images/sprig.svg) center/contain no-repeat;opacity:.8;pointer-events:none}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer b{font-family:"Noto Serif TC",serif;font-weight:600;color:var(--wine);font-size:16px}
[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:50;background:rgba(40,30,26,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 16px}
.lb.open{display:flex}
.lb img{max-height:calc(100% - 70px);max-width:100%;object-fit:contain;border-radius:8px}

.lb button{position:absolute;font:inherit;background:rgba(255,255,255,.14);color:#fff;border:0;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:22px}

.lb .x{top:10px;right:12px}.lb .pv{left:12px;top:50%}.lb .nx{right:12px;top:50%}

</head>

<h2>我的手作小天地</h2>
<p>FiFi.Stitch 是我的手作小角落。2017 年車縫上第一枚 FiFiW 布標，從一個個紅包袋開始，慢慢做出筆袋、化妝包、斜背包，這幾年也開始學皮革，從打紙型、裁皮，一路做到完成一只包。</p>
<p>我喜歡的暗藏故事的表布，打開掀蓋或拉鍊後是另一塊花布，這是我留給使用者的小驚喜。</p>
<p>跟著2026 年的新布標，繼續一針一線創作生活。</p>

const CATS=[["紅包袋", "hongbao", "hb-meizhi-1.jpg"], ["筆袋", "pencil-case", "27.jpg"], ["化妝包", "pouch", "77.jpg"], ["斜背包", "crossbody", "42.jpg"], ["皮革包", "leather", "79.jpg"], ["托特包", "tote", "76.jpg"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const count=c=>WORKS.filter(w=>w.c===c).length;
$("#nav").innerHTML=CATS.map(([c,id])=>`<a href="#${id}" data-id="${id}">${esc(c)}</a>`).join("")+`<a href="#about" data-id="about">關於</a>`;
$("#patches").innerHTML=CATS.map(([c,id,img])=>`<a class="patch" href="#${id}"><div class="ph"><img src="images/thumb/${img}" alt="${esc(c)}"></div><div class="nm"><b>${esc(c)}</b><span>${count(c)} 件作品</span></div></a>`).join("");
const card=(w,i)=>{
 const red=w.c==="紅包袋";const t=red?[]:w.p.slice(1,6);
 return `<article class="work"><button class="cover" data-w="${i}" data-k="0" aria-label="看 ${esc(w.n)} 的照片"><img src="images/thumb/${w.p[0][0]}" alt="${esc(w.n)}" loading="lazy">${w.p.length>1?`<span class="cnt">${w.p.length} 張</span>`:""}</button><div class="body"><h3>${esc(w.n)}<span>${esc(w.y)}</span></h3><p>${esc(w.d)}</p>${t.length?`<div class="thumbs">${t.map((p,k)=>`<button data-w="${i}" data-k="${k+1}" aria-label="${esc(w.n)} 第 ${k+2} 張"><img src="images/thumb/${p[0]}" alt="" loading="lazy"></button>`).join("")}${w.p.length>6?`<span class="more">+${w.p.length-6}</span>`:""}</div>`:""}</div></article>`};
const route=()=>{
 const h=location.hash.slice(1);const cat=CATS.find(c=>c[1]===h);
 document.querySelectorAll("#nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.id===h));
 if(cat){
  $("#home").hidden=true;$("#aboutview").hidden=true;$("#catview").hidden=false;
  $("#cattitle").innerHTML=`${esc(cat[0])}<small>${count(cat[0])} 件作品</small>`;
  $("#catgrid").innerHTML=WORKS.map((w,i)=>[w,i]).filter(([w])=>w.c===cat[0]).map(([w,i])=>card(w,i)).join("");
  document.title=`${cat[0]}｜FiFi.Stitch`;window.scrollTo(0,0);
 }else{
  const ab=h==="about";
  $("#home").hidden=ab;$("#aboutview").hidden=!ab;$("#catview").hidden=true;
  document.title=ab?"關於｜FiFi.Stitch":"FiFi.Stitch｜手作布包";window.scrollTo(0,0);
 }
};
window.addEventListener("hashchange",route);route();
const lb=$("#lb"),li=$("#lbi"),lc=$("#lbc");let cw=0,ck=0,last=null;
const show=()=>{const w=WORKS[cw],p=w.p[ck];li.src="images/"+p[0];li.alt=w.n+(p[1]?"，"+p[1]:"");lc.textContent=`${w.n}${p[1]?"｜"+p[1]:""}　${ck+1} / ${w.p.length}`;const one=w.p.length<2;$("#lbp").hidden=one;$("#lbn").hidden=one;};
const open=(w,k,el)=>{cw=w;ck=k;last=el;show();lb.classList.add("open");document.body.style.overflow="hidden";$("#lbx").focus();};
const close=()=>{lb.classList.remove("open");document.body.style.overflow="";li.removeAttribute("src");last&&last.focus();};
const step=d=>{const n=WORKS[cw].p.length;ck=(ck+d+n)%n;show();};
document.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(b&&!lb.contains(b))open(+b.dataset.w,+b.dataset.k,b);});
$("#lbx").onclick=close;$("#lbp").onclick=()=>step(-1);$("#lbn").onclick=()=>step(1);
lb.addEventListener("click",e=>{if(e.target===lb)close();});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);});
let sx=null;lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1);sx=null;});
}
</script>
